name: Windows tests and release

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run offline tests
        run: python scripts/run_tests.py
      - name: Build Windows application
        run: python -m PyInstaller --noconfirm --clean TelegramVideoSearch.spec
      - name: Check packaged startup
        shell: pwsh
        run: |
          $checkDir = Join-Path $env:RUNNER_TEMP 'telegram-video-search-smoke'
          $checkImage = Join-Path $env:RUNNER_TEMP 'telegram-video-search-smoke.png'
          $checkApp = Start-Process -FilePath '.\dist\TelegramVideoSearch\TelegramVideoSearch.exe' -ArgumentList @('--smoke-test', '--data-dir', ('"' + $checkDir + '"'), '--screenshot', ('"' + $checkImage + '"')) -WindowStyle Hidden -PassThru
          if (-not $checkApp.WaitForExit(30000)) { throw 'Packaged startup timed out.' }
          if ($checkApp.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $checkImage)) { throw 'Packaged startup check failed.' }
      - name: Package without account data
        run: python scripts/package_release.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release
          path: release/TelegramVideoSearch-Windows.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-release
          path: artifacts
      - name: Publish Windows download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/TelegramVideoSearch-Windows.zip \
            --verify-tag --title "Telegram Video Search $RELEASE_TAG" \
            --notes "Windows x64 desktop application. Extract the complete ZIP and launch TelegramVideoSearch.exe. API credentials and account data are supplied locally by each user; no accounts or channels are preconfigured."
